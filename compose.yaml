name: kamogis
services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${PG_DB:-kamogis}
      POSTGRES_USER: ${PG_USER:-kamogis}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is not set. Copy .env.example to .env first.}
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${MONGO_PORT:-57017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-kamogis}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is not set. Copy .env.example to .env first.}
    volumes:
      - mongodata:/data/db
      - ./db/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
  mongodata:
