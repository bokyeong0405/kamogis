<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b8b83"/>
    </marker>
    <style>
      .grp   { font-size:11px; fill:#6b7b73; letter-spacing:.3px; }
      .nm    { font-size:12.5px; fill:#1d3b31; font-weight:600; }
      .ct    { font-size:15px; fill:#244b3d; font-weight:700; }
      .sub   { font-size:9.5px; fill:#8a978f; }
      .hd    { font-size:12.5px; fill:#1d3b31; font-weight:700; }
      .bd    { font-size:10.5px; fill:#55665e; }
      .mono  { font-size:10px; fill:#3c5a4e; font-family:'SF Mono',Menlo,Consolas,monospace; }
      .arrow { stroke:#7b8b83; stroke-width:1.2; marker-end:url(#a); }
      .lbl   { font-size:9.5px; fill:#8a978f; }
      .card  { fill:#fff; stroke:#cfdad4; }
      .key   { fill:#f3f8f5; stroke:#a9c2b5; }
    </style>
  </defs>

  <!-- ─────────── 원본 4종 ─────────── -->
  <text class="grp" x="25" y="14">대중교통 3종</text>
  <line x1="25" y1="19" x2="465" y2="19" stroke="#cfdad4" stroke-width="1"/>
  <text class="grp" x="495" y="14">행정 경계 1종</text>
  <line x1="495" y1="19" x2="655" y2="19" stroke="#cfdad4" stroke-width="1"/>

  <g>
    <rect class="card" x="25"  y="27" width="135" height="58" rx="5"/>
    <text class="nm"  x="92.5"  y="45" text-anchor="middle">버스정류소</text>
    <text class="ct"  x="92.5"  y="64" text-anchor="middle">11,236</text>
    <text class="sub" x="92.5"  y="77" text-anchor="middle">서울시 · XLSX</text>

    <rect class="card" x="175" y="27" width="135" height="58" rx="5"/>
    <text class="nm"  x="242.5" y="45" text-anchor="middle">따릉이 대여소</text>
    <text class="ct"  x="242.5" y="64" text-anchor="middle">2,789</text>
    <text class="sub" x="242.5" y="77" text-anchor="middle">서울시 · XLSX</text>

    <rect class="card" x="325" y="27" width="140" height="58" rx="5"/>
    <text class="nm"  x="395"   y="45" text-anchor="middle">도시철도역</text>
    <text class="ct"  x="395"   y="64" text-anchor="middle">1,094</text>
    <text class="sub" x="395"   y="77" text-anchor="middle">국가철도공단 · XLSX</text>

    <rect class="card" x="495" y="27" width="160" height="58" rx="5" fill="#fbfdfc"/>
    <text class="nm"  x="575"   y="45" text-anchor="middle">행정동 경계</text>
    <text class="ct"  x="575"   y="64" text-anchor="middle">427</text>
    <text class="sub" x="575"   y="77" text-anchor="middle">SGIS · SHP(폴리곤)</text>
  </g>

  <line class="arrow" x1="340" y1="85" x2="340" y2="101"/>

  <!-- ─────────── 해석·검수 ─────────── -->
  <rect class="key" x="25" y="101" width="630" height="68" rx="5"/>

  <text class="hd" x="39" y="119">좌표계 해석</text>
  <text class="mono" x="126" y="119">원본 표기 WGS84(EPSG-5179) — 이름·코드 모순</text>
  <text class="bd" x="39" y="134">7종 비교 측정(4326·3857·5179·5186·<tspan fill="#244b3d" font-weight="700">5181 카카오맵</tspan>·5174·32652) → <tspan fill="#244b3d" font-weight="700">4326 저장</tspan> 확정</text>

  <line x1="39" y1="143" x2="641" y2="143" stroke="#cfdad4" stroke-width="1" stroke-dasharray="2 3"/>

  <text class="hd" x="39" y="160">적재 검수</text>
  <text class="bd" x="126" y="160">4지표(최대간격·ST_IsSimple·최근접역·시도 중앙값) → 좌표오류 3건 · 미검증 노선 8건 <tspan fill="#244b3d" font-weight="700">수정 대신 기록</tspan></text>

  <line class="arrow" x1="340" y1="169" x2="340" y2="187"/>

  <!-- ─────────── 저장 ─────────── -->
  <rect class="card" x="25" y="187" width="410" height="76" rx="5"/>
  <text class="hd"  x="39" y="206">PostgreSQL 17.5 + PostGIS 3.5.2</text>
  <text class="mono" x="39" y="224">separated · boundary · transit</text>
  <text class="bd"  x="39" y="241">GiST 공간 인덱스 · geometry(4326)</text>
  <text class="bd"  x="39" y="256">역 점 → <tspan class="mono">ST_MakeLine</tspan> 으로 노선 형상 50건 생성</text>

  <rect x="455" y="187" width="200" height="76" rx="5" fill="#fafbfa" stroke="#d6ded9" stroke-dasharray="4 3"/>
  <text class="hd" x="469" y="206" fill="#6b7b73">저장 모델 비교 실험</text>
  <text class="bd" x="469" y="223">PG 통합 · MongoDB 통합/분리</text>
  <text class="bd" x="469" y="238">40조건 실측 → <tspan fill="#244b3d" font-weight="700">분리 모델 채택</tspan></text>
  <text class="sub" x="469" y="253">조회 API는 이 경로를 쓰지 않음</text>

  <line class="arrow" x1="230" y1="263" x2="230" y2="289"/>
  <text class="lbl" x="238" y="280">JDBC</text>

  <!-- ─────────── API ─────────── -->
  <rect class="card" x="25" y="289" width="410" height="60" rx="5"/>
  <text class="hd"  x="39" y="308">Spring Boot 조회 API</text>
  <text class="bd"  x="39" y="325">bbox 레이어 조회 8종 · GeoJSON 응답</text>
  <text class="bd"  x="39" y="341">행정동 ∩ 시설점 <tspan class="mono">ST_Contains</tspan> 동별 집계 (서버 계산)</text>

  <line class="arrow" x1="230" y1="349" x2="230" y2="375"/>
  <text class="lbl" x="238" y="366">/api → Vite 프록시</text>

  <!-- ─────────── 화면 ─────────── -->
  <rect class="card" x="25" y="375" width="410" height="60" rx="5"/>
  <text class="hd"  x="39" y="394">React + OpenLayers <tspan class="bd" font-weight="400">— 표시 좌표계 EPSG:3857</tspan></text>
  <text class="bd"  x="39" y="411">레이어 토글 · 동 클릭 시 버스/따릉이/지하철 요약</text>
  <text class="bd"  x="39" y="427">미검증 노선은 <tspan fill="#244b3d" font-weight="700">점선</tspan> — 신뢰하지 않는다는 표시를 화면까지 전달</text>

  <!-- 우측 하단 캡션 -->
  <text class="sub" x="655" y="394" text-anchor="end">Docker Compose로</text>
  <text class="sub" x="655" y="407" text-anchor="end">DB 2종 로컬 구동</text>
  <text class="sub" x="655" y="427" text-anchor="end">github.com/bokyeong0405/kamogis</text>
</svg>
